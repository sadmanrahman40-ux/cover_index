<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cover Page & Index Maker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri&family=Lora&family=Merriweather&family=Noto+Serif+Bengali&family=Playfair+Display&family=Poppins&family=Roboto&display=swap">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f27;--mut:#667085;--bd:#d9dde5;--ac:#2f5bea;--acx:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1e2128;--tx:#e8eaee;--mut:#9aa3b2;--bd:#363b46;--ac:#6f8dff;--acx:#10131a}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1e2128;--tx:#e8eaee;--mut:#9aa3b2;--bd:#363b46;--ac:#6f8dff;--acx:#10131a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:16px 16px 8px;max-width:1200px;margin:auto}
h1{font-size:20px;margin:0 0 10px}
.tabs{display:flex;gap:6px}
.tab,button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer}
.tab.on,button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac)}
main{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:16px;max-width:1200px;margin:auto;padding:8px 16px 32px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:14px 0 6px}
.panel h2:first-child{margin-top:0}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 2px}
input,select,textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.preview{overflow-x:auto;display:flex;justify-content:center;align-items:flex-start}
.paper{background:#fff;color:#000;width:210mm;min-height:297mm;padding:14mm;font-family:"Times New Roman",Georgia,serif;box-shadow:0 2px 14px rgba(0,0,0,.25);flex:none;zoom:var(--z,1)}
.frame{border:3px double var(--pc,#000);min-height:269mm;padding:12mm 10mm;display:flex;flex-direction:column;align-items:center;text-align:center}
.frame img{max-height:34mm;max-width:50mm;margin-bottom:6mm}
.inst{font-size:24pt;font-weight:700;line-height:1.15}
.dept{font-size:15pt;margin-top:3mm}
.rule{width:60%;border-top:2px solid var(--pc,#000);margin:8mm 0}
.dtype{font-size:26pt;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.course{font-size:14pt;margin-top:6mm}
.topic{margin-top:10mm;border:1.5px solid #000;padding:5mm 8mm;font-size:16pt;font-weight:700;max-width:90%}
.sub{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:10mm;width:100%;text-align:left;font-size:12pt}
.sub h4{margin:0 0 2mm;font-size:12pt;text-decoration:underline}
.sub p{margin:0 0 1mm}
.date{margin-top:8mm;font-size:12pt}
.idx h2{text-align:center;font-size:24pt;text-transform:uppercase;letter-spacing:.15em;margin:0 0 3mm}
.idx .meta{text-align:center;margin-bottom:8mm;font-size:12pt}
.idx table{width:100%;border-collapse:collapse;font-size:12pt}
.idx th,.idx td{border:1.5px solid #000;padding:2.5mm 3mm;text-align:left;vertical-align:top}
.idx th{background:#eee;text-transform:uppercase;font-size:11pt}
.idx td:first-child,.idx th:first-child{width:14mm;text-align:center}
.idx td:nth-child(3),.idx th:nth-child(3){width:24mm;text-align:center}
.idx td:nth-child(4),.idx th:nth-child(4){width:34mm}
.items .it{display:grid;grid-template-columns:1fr 60px 28px;gap:6px;margin-top:6px}
.items .it input{padding:6px}
.x{padding:4px;text-align:center}
.hide{display:none}
.note{font-size:12px;color:var(--mut);margin-top:8px}
.sig{display:flex;justify-content:space-between;width:100%;margin-top:16mm;font-size:11pt}
.sig div{border-top:1.5px solid #000;padding-top:1.5mm;min-width:55mm;text-align:center}
.theme{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:12px}
.theme label{margin:0;display:flex;gap:6px;align-items:center}
.theme select,.theme input{width:auto}
.theme input[type=color]{padding:2px;height:34px;width:44px}
.paper{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.paper[data-pst=modern]{font-family:system-ui,"Segoe UI",Arial,sans-serif}
.paper[data-pst=modern] .frame{border:0;border-left:10mm solid var(--pc);align-items:flex-start;text-align:left;padding-left:12mm}
.paper[data-pst=modern] .rule{border-top:3px solid var(--pc);width:30mm}
.paper[data-pst=modern] .inst,.paper[data-pst=modern] .dtype{color:var(--pc)}
.paper[data-pst=modern] .dtype{letter-spacing:.04em}
.paper[data-pst=modern] .topic{border:0;border-left:4px solid var(--pc);background:rgba(0,0,0,.05);padding:3mm 5mm;text-align:left}
.paper[data-pst=modern].idx th{background:var(--pc);color:#fff}
.paper[data-pst=modern].idx h2{color:var(--pc)}
.paper[data-pst=elegant]{font-family:Georgia,"Times New Roman",serif}
.paper[data-pst=elegant] .frame{border:1px solid var(--pc);outline:1px solid var(--pc);outline-offset:-2.5mm}
.paper[data-pst=elegant] .inst,.paper[data-pst=elegant] .dtype{color:var(--pc)}
.paper[data-pst=elegant] .dtype{font-weight:400;font-style:italic;letter-spacing:.06em;text-transform:none}
.paper[data-pst=elegant] .topic{border:0;border-top:1px solid var(--pc);border-bottom:1px solid var(--pc);font-style:italic}
.paper[data-pst=elegant].idx th{background:transparent;color:var(--pc);border-color:var(--pc)}
.paper[data-pst=elegant].idx td{border-color:var(--pc)}
.paper[data-pst=minimal] .frame{border:0}
.paper[data-pst=minimal] .inst{font-weight:400;font-size:19pt;letter-spacing:.2em;text-transform:uppercase}
.paper[data-pst=minimal] .dtype{font-weight:300;letter-spacing:.3em}
.paper[data-pst=minimal] .rule{width:20mm;border-top:1px solid var(--pc)}
.paper[data-pst=minimal] .topic{border:0;font-weight:400}
.paper[data-pst=minimal].idx th{background:transparent;border-width:0 0 1.5px}
.paper[data-pst=minimal].idx td{border-width:0 0 1px;border-color:#999}
.paper[data-pst=minimal].idx h2{font-weight:400;letter-spacing:.3em}
.paper .inst{font-size:calc(24pt*var(--fs,1))}
.paper[data-pst=minimal] .inst{font-size:calc(19pt*var(--fs,1))}
.paper .dept{font-size:calc(15pt*var(--fs,1))}
.paper .dtype{font-size:calc(26pt*var(--fs,1))}
.paper .course{font-size:calc(14pt*var(--fs,1))}
.paper .topic{font-size:calc(16pt*var(--fs,1))}
.paper .sub,.paper .sub h4,.paper .date,.paper.idx .meta,.paper.idx table{font-size:calc(12pt*var(--fs,1))}
.paper.idx h2{font-size:calc(24pt*var(--fs,1))}
.paper.idx th,.paper .sig{font-size:calc(11pt*var(--fs,1))}
.paper[data-pst=bars],.paper[data-pst=corners]{position:relative}
.paper[data-pst=bars] .frame,.paper[data-pst=corners] .frame{position:relative;z-index:1;border:0}
.paper[data-pst=bars]::before,.paper[data-pst=bars]::after{content:"";position:absolute;left:0;right:0;height:9mm;background:var(--pc)}
.paper[data-pst=bars]::before{top:0}
.paper[data-pst=bars]::after{bottom:0}
.paper[data-pst=bars] .inst,.paper[data-pst=bars] .dtype{color:var(--pc)}
.paper[data-pst=bars] .rule{border-top:3px solid var(--pc)}
.paper[data-pst=bars] .topic{border:2px solid var(--pc)}
.paper[data-pst=royal] .frame{border:6px double var(--pc);outline:1px solid var(--pc);outline-offset:3mm}
.paper[data-pst=royal] .inst,.paper[data-pst=royal] .dtype{color:var(--pc)}
.paper[data-pst=royal] .topic{border:1px solid var(--pc);box-shadow:0 0 0 2px #fff,0 0 0 3px var(--pc)}
.paper[data-pst=corners]::before,.paper[data-pst=corners]::after{content:"";position:absolute;width:45mm;height:45mm}
.paper[data-pst=corners]::before{top:0;left:0;background:linear-gradient(135deg,var(--pc) 50%,transparent 50%)}
.paper[data-pst=corners]::after{bottom:0;right:0;background:linear-gradient(315deg,var(--pc) 50%,transparent 50%)}
.paper[data-pst=corners] .inst,.paper[data-pst=corners] .dtype{color:var(--pc)}
.paper[data-pst=corners] .topic{border:0;border-left:4px solid var(--pc);border-right:4px solid var(--pc)}
.paper[data-pst=soft] .frame{border:2px solid var(--pc);border-radius:8mm}
.paper[data-pst=soft] .inst{color:var(--pc)}
.paper[data-pst=soft] .dtype{display:inline-block;background:var(--pc);color:#fff;padding:2mm 8mm;border-radius:50mm;letter-spacing:.08em}
.paper[data-pst=soft] .rule{display:none}
.paper[data-pst=soft] .dept{margin-bottom:8mm}
.paper[data-pst=soft] .topic{border:0;background:rgba(0,0,0,.06);border-radius:4mm}
.paper[data-pst=rules] .frame{border:0;border-top:5px double var(--pc);border-bottom:5px double var(--pc)}
.paper[data-pst=rules] .inst{font-variant:small-caps}
.paper[data-pst=rules] .rule{border-top:1px solid var(--pc);width:40%}
.paper[data-pst=rules] .topic{border:0;border-top:1px solid var(--pc);border-bottom:1px solid var(--pc)}
.paper[data-pst=bars].idx th,.paper[data-pst=royal].idx th,.paper[data-pst=corners].idx th,.paper[data-pst=soft].idx th{background:var(--pc);color:#fff}
.paper[data-pst=bars].idx h2,.paper[data-pst=royal].idx h2,.paper[data-pst=corners].idx h2{color:var(--pc)}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff}
 header,.panel,.note{display:none!important}
 main{display:block;padding:0;margin:0;max-width:none}
 .preview{display:block}
 .paper{box-shadow:none;zoom:1;width:210mm;min-height:297mm}
}
</style>
</head>
<body>
<header>
 <h1>Cover Page & Index Maker</h1>
 <div class="tabs"><button class="tab on" data-t="cover">Cover page</button><button class="tab" data-t="index">Index</button></div>
 <div class="theme">
  <label>App theme <select id="ui"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
  <label>Paper style <select id="pst"><option value="classic">Classic</option><option value="modern">Modern</option><option value="elegant">Elegant</option><option value="minimal">Minimal</option><option value="bars">Bars</option><option value="royal">Royal</option><option value="corners">Corners</option><option value="soft">Soft</option><option value="rules">Rules</option></select></label>
  <label>Accent <input id="pcol" type="color" value="#1f3a8a"></label>
  <label>Font <select id="fnt">
   <option value="">Style default</option>
   <option value="'Times New Roman',Times,serif">Times New Roman</option>
   <option value="Georgia,serif">Georgia</option>
   <option value="Arial,Helvetica,sans-serif">Arial</option>
   <option value="Calibri,'Segoe UI',Arial,sans-serif">Calibri</option>
   <option value="Verdana,Geneva,sans-serif">Verdana</option>
   <option value="'Courier New',monospace">Courier New</option>
   <option value="'Playfair Display',Georgia,serif">Playfair Display</option>
   <option value="Merriweather,Georgia,serif">Merriweather</option>
   <option value="Lora,Georgia,serif">Lora</option>
   <option value="Roboto,Arial,sans-serif">Roboto</option>
   <option value="Poppins,Arial,sans-serif">Poppins</option>
   <option value="'Hind Siliguri','Times New Roman',sans-serif">Hind Siliguri (Bengali)</option>
   <option value="'Noto Serif Bengali','Times New Roman',serif">Noto Serif Bengali</option>
  </select></label>
  <label>Text size <select id="fsz"><option value="0.85">Small</option><option value="1" selected>Normal</option><option value="1.15">Large</option><option value="1.3">Extra large</option></select></label>
 </div>
</header>
<main>
 <section class="panel" id="formCover">
  <h2>Institution</h2>
  <label>University / College</label><input id="inst" value="Mymensingh Engineering College">
  <label>Department</label><input id="dept" value="Department of Electrical and Electronic Engineering">
  <label>Logo (optional)</label><input id="logo" type="file" accept="image/*">
  <h2>Document</h2>
  <label>Type</label>
  <select id="dtype"><option>Assignment</option><option>Lab Report</option><option>Project Report</option><option>Thesis</option><option>Term Paper</option></select>
  <div class="two"><div><label>Course title</label><input id="ctitle" placeholder="Optoelectronics"></div><div><label>Course code</label><input id="ccode" placeholder="EEE 4115"></div></div>
  <label>Topic / title</label><textarea id="topic" rows="2" placeholder="Topic of the assignment"></textarea>
  <h2>Submitted by</h2>
  <label>Name</label><input id="sname" value="Sadman Rahman">
  <div class="two"><div><label>Roll</label><input id="roll" value="210152"></div><div><label>Reg. no.</label><input id="reg" value="1398"></div></div>
  <label>Session</label><input id="sess" value="2021-22">
  <h2>Submitted to</h2>
  <label>Name</label><input id="tname">
  <label>Designation</label><input id="tdes" value="Lecturer">
  <label>Submission date</label><input id="date" type="date">
  <h2>Signature</h2>
  <label>Signature lines</label><select id="sig"><option value="t">Teacher only</option><option value="ts">Teacher and student</option><option value="n">None</option></select>
  <label>Teacher signature label</label><input id="siglab" value="Teacher’s Signature">
  <div class="row"><button class="pri" onclick="window.print()">Print / Save PDF</button><button onclick="clr()">Reset</button></div>
  <p class="note">In the print dialog choose “Save as PDF”, paper A4, margins None.</p>
 </section>
 <section class="panel hide" id="formIndex">
  <h2>Header</h2>
  <label>Index title</label><input id="ititle" value="Index">
  <label>Subtitle (course / name)</label><input id="isub" placeholder="EEE 4115 · Sadman Rahman">
  <h2>Entries</h2>
  <div class="items" id="items"></div>
  <div class="row"><button onclick="addRow()">+ Add row</button><button onclick="autoNum()">Auto page numbers</button></div>
  <label>Pages per entry (for auto)</label><input id="ppe" type="number" min="1" value="1">
  <label>Show remarks column</label><select id="rem"><option value="1">Yes</option><option value="0">No</option></select>
  <div class="row"><button class="pri" onclick="window.print()">Print / Save PDF</button></div>
 </section>
 <section class="preview">
  <div class="paper" id="pCover"><div class="frame">
   <img id="vlogo" class="hide" alt="">
   <div class="inst" id="vinst"></div><div class="dept" id="vdept"></div>
   <div class="rule"></div>
   <div class="dtype" id="vtype"></div>
   <div class="course" id="vcourse"></div>
   <div class="topic" id="vtopic"></div>
   <div class="sub">
    <div><h4>Submitted by</h4><div id="vby"></div></div>
    <div><h4>Submitted to</h4><div id="vto"></div></div>
   </div>
   <div class="sig" id="vsig"></div>
   <div class="date" id="vdate"></div>
  </div></div>
  <div class="paper idx hide" id="pIndex">
   <h2 id="vit"></h2><div class="meta" id="vis"></div>
   <table><thead id="vth"></thead><tbody id="vtb"></tbody></table>
  </div>
 </section>
</main>
<script>
var $=function(i){return document.getElementById(i)};
var logoData="",rows=[{t:"",p:"",r:""}],tab="cover";
var ids=["inst","dept","dtype","ctitle","ccode","topic","sname","roll","reg","sess","tname","tdes","date","ititle","isub","rem","pst","pcol","sig","siglab","fnt","fsz"];
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function ln(s){return esc(s).replace(/\n/g,"<br>")}
function fmtDate(v){if(!v)return"";var d=new Date(v+"T00:00:00");return isNaN(d)?v:d.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}
function render(){
 var v=function(i){return $(i).value.trim()};
 $("vinst").innerHTML=ln(v("inst"));$("vdept").innerHTML=ln(v("dept"));
 $("vtype").textContent=v("dtype");
 var c=[v("ctitle"),v("ccode")].filter(Boolean);
 $("vcourse").innerHTML=c.length?"Course: "+esc(c.join(" ("))+(c.length>1?")":""):"";
 $("vtopic").innerHTML=ln(v("topic")||"Topic");
 $("vtopic").classList.toggle("hide",!v("topic"));
 $("vby").innerHTML=[v("sname")&&"<p><b>"+esc(v("sname"))+"</b></p>",v("roll")&&"<p>Roll: "+esc(v("roll"))+"</p>",v("reg")&&"<p>Reg. No: "+esc(v("reg"))+"</p>",v("sess")&&"<p>Session: "+esc(v("sess"))+"</p>"].filter(Boolean).join("");
 $("vto").innerHTML=[v("tname")&&"<p><b>"+esc(v("tname"))+"</b></p>",v("tdes")&&"<p>"+esc(v("tdes"))+"</p>",v("dept")&&"<p>"+esc(v("dept").replace(/^Department of /,"Dept. of "))+"</p>"].filter(Boolean).join("");
 $("vdate").innerHTML=v("date")?"Date of submission: "+esc(fmtDate(v("date"))):"";
 $("vlogo").src=logoData;$("vlogo").classList.toggle("hide",!logoData);
 var sg=$("sig").value,sl=esc(v("siglab")||"Teacher’s Signature");
 $("vsig").style.display=sg==="n"?"none":"";
 $("vsig").innerHTML=sg==="n"?"":(sg==="ts"?"<div>Student’s Signature</div>":"<div style='visibility:hidden'></div>")+"<div>"+sl+"</div>";
 ["pCover","pIndex"].forEach(function(i){$(i).dataset.pst=$("pst").value;$(i).style.fontFamily=$("fnt").value;$(i).style.setProperty("--fs",$("fsz").value);$(i).style.setProperty("--pc",$("pcol").value)});
 $("vit").textContent=v("ititle")||"Index";$("vis").textContent=v("isub");
 var r=$("rem").value==="1";
 $("vth").innerHTML="<tr><th>SL</th><th>Topic</th><th>Page</th>"+(r?"<th>Remarks</th>":"")+"</tr>";
 $("vtb").innerHTML=rows.map(function(x,i){return"<tr><td>"+(i+1)+"</td><td>"+esc(x.t)+"</td><td>"+esc(x.p)+"</td>"+(r?"<td>"+esc(x.r)+"</td>":"")+"</tr>"}).join("");
 try{localStorage.setItem("cim",JSON.stringify({f:ids.map(function(i){return $(i).value}),rows:rows}))}catch(e){}
}
function drawRows(){
 $("items").innerHTML="";
 rows.forEach(function(x,i){
  var d=document.createElement("div");d.className="it";
  d.innerHTML='<input placeholder="Topic" value="'+esc(x.t).replace(/"/g,"&quot;")+'"><input placeholder="Page" value="'+esc(x.p).replace(/"/g,"&quot;")+'"><button class="x" title="Remove">×</button>';
  var inp=d.querySelectorAll("input");
  inp[0].oninput=function(){x.t=inp[0].value;render()};
  inp[1].oninput=function(){x.p=inp[1].value;render()};
  d.querySelector("button").onclick=function(){rows.splice(i,1);if(!rows.length)rows.push({t:"",p:"",r:""});drawRows();render()};
  $("items").appendChild(d);
 });
}
function addRow(){rows.push({t:"",p:"",r:""});drawRows();render()}
function autoNum(){var n=Math.max(1,+$("ppe").value||1),p=1;rows.forEach(function(x){x.p=n>1?p+"–"+(p+n-1):String(p);p+=n});drawRows();render()}
function clr(){ids.forEach(function(i){var e=$(i);if(e.tagName!=="SELECT"&&e.type!=="color")e.value=""});logoData="";rows=[{t:"",p:"",r:""}];drawRows();render()}
function setTab(t){tab=t;
 document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on",b.dataset.t===t)});
 $("formCover").classList.toggle("hide",t!=="cover");$("formIndex").classList.toggle("hide",t!=="index");
 $("pCover").classList.toggle("hide",t!=="cover");$("pIndex").classList.toggle("hide",t!=="index");
 fit();
}
function fit(){var w=document.querySelector(".preview").clientWidth,pw=210*3.78+2*14*3.78;
 var z=Math.min(1,(w-4)/(210*3.78));document.documentElement.style.setProperty("--z",z)}
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){setTab(b.dataset.t)}});
ids.forEach(function(i){$(i).addEventListener("input",render);$(i).addEventListener("change",render)});
$("logo").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){logoData=r.result;render()};r.readAsDataURL(f)};
window.addEventListener("resize",fit);
try{var s=JSON.parse(localStorage.getItem("cim")||"null");if(s){ids.forEach(function(i,k){if(s.f[k]!=null)$(i).value=s.f[k]});if(s.rows&&s.rows.length)rows=s.rows}}catch(e){}
if(!$("date").value)$("date").value=new Date().toISOString().slice(0,10);
var ui=$("ui");
function applyUi(){var v=ui.value;if(v==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",v);try{localStorage.setItem("cim-ui",v)}catch(e){}}
try{ui.value=localStorage.getItem("cim-ui")||"auto"}catch(e){}
ui.onchange=applyUi;applyUi();
drawRows();render();fit();
</script>
</body>
</html>
